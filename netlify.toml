[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24.14.1"
  NPM_VERSION = "11.19.0"

[dev]
  command = "npm run dev"
  targetPort = 4321
  port = 8888
  publish = "dist"

# /industrias/ se retiró: contenido huérfano sin enlaces ni estilos.
[[redirects]]
  from = "/industrias/*"
  to = "/soluciones/"
  status = 301
